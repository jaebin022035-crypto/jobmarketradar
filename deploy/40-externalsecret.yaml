# ============================================================
# Secret — DHS_API_KEY (채용정보 수집 API 인증키)
# ------------------------------------------------------------
# 이 클러스터의 Secret 관리 정석 = Vault + ExternalSecret.
# (기존 default/board-secret 이 같은 패턴으로 동작 중: vault-backend SecretStore)
#
# ArgoCD GitOps 원칙: Git 에 평문 Secret 을 두지 않는다.
#   → ExternalSecret 으로 Vault 에서 동기화. ArgoCD 는 이 CR 만 바라본다.
#
# 전제:
#   - default/vault-backend SecretStore (KV v2, http://vault.default:8200) 사용
#   - Vault 경로 secret/data/jobradar/DHS_API_KEY 에 값이 있어야 함
#     (권한이 없다면 아래 수동 방식 사용)
#
# ★ Vault 권한이 없을 때 (수동 1회 생성 — Git 에 커밋 금지):
#   kubectl -n jobradar create secret generic jobradar-secret \
#     --from-literal=DHS_API_KEY='<실제키>'
#   이 경우 이 파일은 apply 하지 않는다. (ArgoCD Application 의 ignoreDifferences 로
#   Secret 의 data 필드 차이를 무시하게 하거나, Application 에서 Secret 을 제외.)
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jobradar-secret
  namespace: jobradar
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: jobradar-secret
    creationPolicy: Owner
  data:
    - secretKey: DHS_API_KEY
      remoteRef:
        key: jobradar            # Vault KV v2 경로 (secret/jobradar)
        property: DHS_API_KEY
