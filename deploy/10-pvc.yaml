# ============================================================
# PVC — SQLite DB 영속 볼륨 (data/jobmarket.db)
# ------------------------------------------------------------
# JobMarketRadar 는 단일 Node 서버 + SQLite → replicas=1 고정(RWO).
# initContainer 가 PVC가 비어있을 때만 이미지 내장 시드 DB를 복사.
# StorageClass: nfs-std-1(default) — 클러스터에서 검증됨.
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobradar-data
  namespace: jobradar
spec:
  accessModes:
    - ReadWriteOnce          # SQLite 단일 쓰기 → RWO + replicas=1
  resources:
    requests:
      storage: 512Mi
  storageClassName: nfs-std-1   # 클러스터 기본 StorageClass (정상 동작 확인)
